
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: swiftride_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swiftride-network

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: swiftride_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: swiftride_matching
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swiftride-network

  # Matching Service
  matching_service:
    build:
      context: .
      dockerfile: src/MatchingService/MatchingService.Api/Dockerfile
    container_name: matching_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083

      # Database connection inside Docker network
      ConnectionStrings__MatchingServiceDb: ${MATCHING_DB_CONNECTION:-Server=mysql;Port=3306;Database=swiftride_matching;User=root;Password=123456;}

      OpenRouteService__ApiKey: ${OPENROUTESERVICE_API_KEY:-}

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-guest}

    ports:
      - "8083:8083"

    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy

    networks:
      - swiftride-network

networks:
  swiftride-network:
    driver: bridge

volumes:
  mysql_data:
