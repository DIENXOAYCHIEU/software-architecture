version: '3.8'

services:
  api_gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
    container_name: api_gateway
    ports:
      - "5000:5000"
    networks:
      - swiftride-network
    depends_on:
      - trip_service
