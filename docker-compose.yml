services:

  mongodb:
    image: mongo:8
    container_name: swiftride-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: SwiftRideMatchDB

    volumes:
      - mongodb_data:/data/db

    networks:
      - swiftride-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  matching-service:
    build:
      context: ./src/MatchingService
      dockerfile: MatchingService.Api/Dockerfile

    container_name: swiftride-matching
    restart: unless-stopped

    ports:
      - "5001:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      MongoDbSettings__ConnectionString: mongodb://mongodb:27017
      MongoDbSettings__DatabaseName: SwiftRideMatchDB
      MongoDbSettings__MatchingCollectionName: matching_requests
      MongoDbSettings__DriverCollectionName: drivers

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - swiftride-network


volumes:
  mongodb_data:


networks:
  swiftride-network:
    driver: bridge